<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерија – Sweet Moments</title>
<link rel="icon" href="/images/logo-square.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<div class="page-head container"><span class="eyebrow">Галерија</span><h1>Нашите слатки моменти</h1><p>Дел од колачињата што ги изработивме со љубов</p></div>
<section class="section" style="padding-top:44px">
  <div class="container">
    <div class="chips" id="chips"></div>
    <div class="masonry" id="gallery"></div>
  </div>
</section>
<div id="site-footer"></div>
<script src="/js/common.js"></script>
<script>
SM.ready.then(d => {
  const used = new Set(d.gallery.map(g => g.category).filter(Boolean));
  const cats = [{ id: '', name: 'Сите' }, ...d.categories.filter(c => used.has(c.id))];
  let cur = '';
  const chips = document.getElementById('chips'), g = document.getElementById('gallery');
  function draw() {
    chips.innerHTML = '';
    chips.classList.toggle('hidden', cats.length <= 2);
    cats.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (c.id === cur ? ' active' : ''); b.textContent = c.name;
      b.onclick = () => { cur = c.id; draw(); }; chips.appendChild(b);
    });
    const items = d.gallery.filter(x => !cur || x.category === cur);
    g.innerHTML = items.length ? items.map(x => `<figure data-src="${SM.esc(x.image)}"><img src="${SM.esc(x.image)}" alt="${SM.esc(x.caption || 'Колачиња Sweet Moments')}" loading="lazy">${x.caption ? `<figcaption>${SM.esc(x.caption)}</figcaption>` : ''}</figure>`).join('')
      : '<p class="center muted">Наскоро нови слики.</p>';
    g.querySelectorAll('figure').forEach(f => f.onclick = () => SM.lightbox(f.dataset.src));
  }
  draw();
});
</script>
</body>
</html>
